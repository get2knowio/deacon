[profile.parity]
retries = 0
slow-timeout = { period = "15m", terminate-after = 1 }
status-level = "pass"
default-filter = 'binary(=parity_differential)'

# The differential binary spans BOTH kinds of resource group, so its two halves are
# throttled by TEST NAME rather than by binary: the config-only drivers are CLI-bound and
# the Docker drivers contend for the daemon. Grouping the whole binary one way would either
# serialize 67 sub-second config cases behind the daemon or let 49 container cases run
# unthrottled.
[[profile.parity.overrides]]
filter = 'binary(=parity_differential) & test(/^differential_group_(none|fs_heavy)$/)'
test-group = 'parity-cli'

# `slow-timeout` is deliberately ABOVE the tier's 30-minute budget (research Decision 10).
# The budget is asserted EXPLICITLY by the binary, which reports the elapsed number and the
# slowest cases; nextest's timeout is only the backstop for a driver that stops making
# progress at all. A backstop that fired FIRST would replace a diagnosable failure with
# "the binary was slow", which is exactly the unattributable signal the explicit assertion
# exists to avoid.
[[profile.parity.overrides]]
filter = 'binary(=parity_differential) & not test(/^differential_group_(none|fs_heavy)$/)'
test-group = 'parity'
slow-timeout = { period = "35m", terminate-after = 1 }