# cargo-nextest configuration for deacon workspace
# Manages test parallelization and grouping for optimal performance

# Minimum supported nextest version for these features
nextest-version = "0.9.111"

# Test groups organize tests by resource requirements and execution constraints
[test-groups]

# Docker-exclusive: Tests that require exclusive Docker daemon access
# These tests create/destroy containers and must not run concurrently
docker-exclusive = { max-threads = 1 }

# Docker-slow-shared: Heavy Docker tests that can overlap once isolation is fixed
docker-slow-shared = { max-threads = 2 }

# Docker-shared: Tests that interact with Docker but can share daemon access
# Increased concurrency for short-lived CLI-level Docker cases
docker-shared = { max-threads = 8 }

# FS-heavy: Tests performing significant filesystem operations
# Limited concurrency to avoid I/O contention
fs-heavy = { max-threads = 4 }
# Host-only environment probe tests: lightweight host shell probing
env-probe = { max-threads = 12 }
# Long-running tests: heavy end-to-end or build-with-large-context tests
long-running = { max-threads = 2 }

# Smoke tests: split lightweight vs heavy daemon cases for higher parallelism
smoke-lite = { max-threads = 4 }
smoke-heavy = { max-threads = 2 }

# CLI-only smoke tests: safe to run in parallel with light throttling
smoke-cli = { max-threads = 8 }

# Parity tests: Tests comparing behavior with upstream devcontainers CLI
# Mildly throttled to allow overlap while avoiding daemon contention
parity = { max-threads = 2 }

# CLI-only parity tests
parity-cli = { max-threads = 8 }

# Parity-harness self-test binaries — `parity_harness_faults`, `raw_outputs`,
# `observation_faults`, `container_state_channel`, `prereq_faults`,
# `normalize_consistency`, `runner_record_replay`, `docker_channels` — are hermetic:
# no Docker daemon, no network, no oracle. They run in EVERY profile, because a guard
# that only runs when the oracle is installed is a guard nobody notices going stale.
# Several carry an `fs-heavy` override, which bounds their fixture-tree I/O; it does not
# admit a daemon.
#
# `normalize_consistency` and `runner_record_replay` do NOT match `binary(#parity_*)`,
# so the live-parity exclusions never capture them.
#
# The four parity lanes split by what a case NEEDS, not by what it is about. Three
# prerequisites, all independent: a registry, a daemon, the pinned oracle.
#   `parity_hermetic`    — nothing at all → runs in EVERY profile, dev-fast included, on
#                          every platform CI runs (#441 removed the Linux gate; the case
#                          data now pins claims deacon can satisfy anywhere). Its own
#                          `hermetic_lane_runs_without_a_network` test re-runs the lane
#                          inside a network namespace, so "nothing at all" is enforced
#                          rather than promised (#544).
#   `parity_registry`    — a registry, no Docker, no oracle → must be selected only by
#                          profiles whose JOB is provisioned for `ghcr.io`. That is
#                          `mvp-integration` (a required PR check that acquires a
#                          read-only GHCR bearer token) and NOT `dev-fast`, whose
#                          `Test (MVP fast)` job has no token, no prepull and no Docker.
#                          It is excluded from `dev-fast` by the `binary(#parity_*)` glob
#                          in that profile's `default-filter`, which lists its exceptions
#                          explicitly — do not add this binary to that exception list.
#   `parity_docker`      — Docker, no oracle    → runs wherever a daemon is available
#   `parity_differential`— needs the pinned oracle → `[profile.parity]` ONLY
# The LIVE binary is `parity_differential`. It must be selected by `[profile.parity]` and
# excluded from every other profile's `default-filter`, or the non-parity lanes stop being
# truthful by non-selection.
# `parity-harness`'s `registry.rs` asserts exactly that against this file — including
# that EVERY profile carries a `default-filter` at all, which is how a past edit that
# dropped four of them was caught.

# Default profile: Balanced parallelization for local development
[profile.default]
retries = 0
slow-timeout = "60s"
status-level = "pass"
# Live parity scenario binaries run ONLY under `--profile parity` (018-harden-parity-harness).
# Exclude them here so the default lane is truthful by non-selection (FR-014).
default-filter = 'not (binary(=parity_differential))'

[[profile.default.overrides]]
filter = 'binary(=smoke_exec) | binary(=smoke_exec_stdin) | binary(=smoke_up_idempotent) | binary(=smoke_down) | binary(=smoke_spinner) | binary(=smoke_lifecycle)'
test-group = 'smoke-heavy'
slow-timeout = { period = "10m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(#smoke_*) & not (binary(=smoke_exec) | binary(=smoke_exec_stdin) | binary(=smoke_up_idempotent) | binary(=smoke_down) | binary(=smoke_spinner) | binary(=smoke_lifecycle))'
test-group = 'smoke-lite'
slow-timeout = { period = "10m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(=smoke_cli)'
test-group = 'smoke-cli'
slow-timeout = { period = "5m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(=up_dotfiles)'
test-group = 'docker-exclusive'
slow-timeout = { period = "5m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(=up_prebuild) | binary(=run_user_commands_prebuild) | binary(=run_user_commands_feature_lifecycle) | binary(=lifecycle_parallel_output) | binary(=up_reconnect_full_id) | binary(=up_keepalive_path)'
test-group = 'docker-exclusive'
slow-timeout = { period = "10m", terminate-after = 1 }

# integration_auto_forward binds real host ports (static `-p` and the user-space
# forwarder's loopback listeners), so it must NOT run concurrently with other
# port-publishing docker tests — serialize it (docker-exclusive). Per T033.
[[profile.default.overrides]]
filter = 'binary(=integration_auto_forward)'
test-group = 'docker-exclusive'
slow-timeout = { period = "10m", terminate-after = 1 }

# Build consistency tests use Docker buildx and can conflict with parallel builds
[[profile.default.overrides]]
filter = 'binary(=build_consistency)'
test-group = 'docker-exclusive'
slow-timeout = { period = "5m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(#parity_*) & not (binary(=parity_harness_faults) | binary(=parity_hermetic) | binary(=parity_registry))'
test-group = 'parity'

[[profile.default.overrides]]
filter = 'binary(=parity_hermetic) | binary(=parity_registry)'
test-group = 'parity-cli'

# Hermetic harness self-tests + parity-harness integration tests (018 US5, T046):
# fs-heavy (bounded I/O for the stub-driven exec + fixture tests). NONE of these
# are selected by [profile.parity]. `parity_registry_check` + `normalize_consistency`
# intentionally stay ungrouped (default group).
[[profile.default.overrides]]
filter = 'binary(=parity_harness_faults) | binary(=raw_outputs) | binary(=observation_faults) | binary(=container_state_channel) | binary(=prereq_faults)'
test-group = 'fs-heavy'
[[profile.default.overrides]]
filter = 'binary(#integration_env_probe_*)'
test-group = 'docker-shared'

[[profile.default.overrides]]
filter = 'binary(=integration_exec_selection) | binary(=integration_exec_id_label)'
test-group = 'docker-shared'
slow-timeout = { period = "5m", terminate-after = 1 }

# integration_up_build_options tests are CLI-only (no actual Docker container operations)
# They test argument parsing and BuildOptions/BuildKitOptions behavior without spawning containers
[[profile.default.overrides]]
filter = 'binary(=integration_up_build_options)'
test-group = 'smoke-cli'
slow-timeout = "60s"

# integration_up_with_features' three Docker tests all bring up the SAME example
# workspace (examples/up/with-features), so they derive the same container identity and
# therefore the same container name. Under `docker-slow-shared` (2 threads) two of them
# race: the second `up --remove-existing-container` creates while the first still holds
# the name, and the daemon rejects it with a name conflict. Which of the three loses is
# scheduling-dependent, so the failure reads as a flake rather than as the shared-fixture
# collision it is. Serialize the binary — `full`/`ci` already do, via their
# `binary(#integration_up_*)` docker-exclusive rule, which is why this only ever surfaced
# in the `default`/`docker`/`long-running` lanes.
[[profile.default.overrides]]
filter = 'binary(=integration_up_with_features)'
test-group = 'docker-exclusive'
slow-timeout = { period = "10m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(=integration_build) | binary(=integration_build_output) | binary(=build_push_metadata) | binary(=integration_build_args) | binary(=integration_vulnerability_scan) | binary(#integration_up_*) | binary(=integration_progress) | binary(=integration_host_ca_runtime) | binary(=integration_host_ca_build)'
test-group = 'docker-slow-shared'
slow-timeout = { period = "30m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(=integration_host_requirements) | binary(=integration_port_forwarding) | binary(=integration_feature_security) | binary(=integration_feature_lifecycle) | binary(=integration_feature_mounts) | binary(=integration_feature_entrypoints) | binary(=integration_compose_features_build) | binary(=integration_compose_config_mounts) | binary(=docker_channels)'
test-group = 'docker-shared'

[[profile.default.overrides]]
filter = 'binary(=integration_gpu_detection) | binary(=up_gpu_all) | binary(=up_gpu_detect) | binary(=up_gpu_none) | binary(=up_gpu_edge_cases) | binary(=up_gpu_consistency) | binary(=up_gpu_output)'
test-group = 'docker-shared'

[[profile.default.overrides]]
filter = 'binary(=integration_up_force_tty_if_json)'
test-group = 'docker-shared'
slow-timeout = { period = "10m", terminate-after = 1 }

# #372 marker config-hash regression: runs `up` twice plus `run-user-commands`
# against its own temp workspace and its own `--user-data-folder`, so it shares
# nothing with sibling cases but the daemon → docker-shared, not exclusive.
# #655/#656/#657/#658/#659: `--container-id` against plain `docker run` containers the
# test creates and removes itself. Shares nothing with sibling cases but the daemon, and
# publishes no ports → docker-shared, not exclusive.
[[profile.default.overrides]]
filter = 'binary(=integration_container_id_foreign)'
test-group = 'docker-shared'
slow-timeout = { period = "10m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(=run_user_commands_marker_config_hash)'
test-group = 'docker-shared'
slow-timeout = { period = "10m", terminate-after = 1 }

# Compose features (bead 14a/14b): pull an OCI feature, run BuildKit, and
# bring up a compose project. Slow due to feature download + image build.
[[profile.default.overrides]]
filter = 'binary(=integration_compose_features_build)'
test-group = 'docker-shared'
slow-timeout = { period = "10m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(=integration_config) | binary(=integration_layered_merge) | binary(=integration_lockfile) | binary(=integration_templates) | binary(=up_lockfile_frozen) | binary(=integration_profiles)'
test-group = 'fs-heavy'
slow-timeout = "5m"

[[profile.default.overrides]]
filter = 'binary(=integration_trust)'
test-group = 'fs-heavy'
slow-timeout = "2m"

[[profile.default.overrides]]
filter = 'binary(=smoke_exec) | binary(=smoke_exec_stdin) | binary(=smoke_up_idempotent) | binary(=smoke_down) | binary(=integration_build) | binary(=integration_build_output) | binary(=build_push_metadata) | binary(=integration_vulnerability_scan) | binary(#integration_up_*) | binary(=integration_progress) | binary(=up_dotfiles)'
priority = 100


[profile.dev-fast]
retries = 0
slow-timeout = "30s"
# Exclude: smoke, parity, Docker-dependent tests, testcontainers-based tests.
#
# `binary(=parity_harness)` is the parity-harness LIB unit-test target (Rust normalizes the
# package name `parity-harness` to the target name `parity_harness`), so the `parity_*`
# glob was silently swallowing every unit test in the harness crate — hermetic, fast, and
# exactly the tests a dev loop should run. That hole let a stale `report::tests` assertion
# survive a green `dev-fast` (024 Phase 4 found it). The glob is meant to exclude the LIVE
# `parity_*` test binaries, not the crate's own unit tests, so the lib joins
# `parity_harness_faults` / `parity_registry_check` as an explicit exception. Its
# shell-dependent tests are already `#[cfg(unix)]`-gated, so the Windows lane is unaffected.
default-filter = 'not (binary(#smoke_*) | (binary(#parity_*) & not (binary(=parity_harness_faults) | binary(=parity_harness) | binary(=parity_hermetic))) | binary(=build_consistency) | binary(=integration_build) | binary(=integration_build_output) | binary(=build_push_metadata) | binary(=integration_build_args) | binary(=integration_vulnerability_scan) | binary(#integration_up_*) | binary(=integration_progress) | binary(#integration_env_probe_*) | test(/^env_probe::tests::/) | binary(=integration_exec_id_label) | binary(=integration_exec_selection) | binary(=testcontainers_helpers) | binary(=workspace_mounts) | binary(=up_prebuild) | binary(=run_user_commands_prebuild) | binary(=run_user_commands_marker_config_hash) | binary(=integration_container_id_foreign) | binary(=run_user_commands_feature_lifecycle) | binary(=lifecycle_parallel_output) | binary(=up_reconnect_full_id) | binary(=up_keepalive_path) | binary(=up_dotfiles) | binary(=integration_feature_lifecycle) | binary(=integration_feature_security) | binary(=integration_feature_mounts) | binary(=integration_compose_features_build) | binary(=integration_compose_config_mounts) | binary(=integration_auto_forward) | binary(=integration_host_ca_runtime) | binary(=integration_host_ca_build) | binary(=docker_channels))'

[[profile.dev-fast.overrides]]
filter = 'binary(=smoke_exec) | binary(=smoke_exec_stdin) | binary(=smoke_up_idempotent) | binary(=smoke_down) | binary(=smoke_spinner) | binary(=smoke_lifecycle)'
test-group = 'smoke-heavy'

[[profile.dev-fast.overrides]]
filter = 'binary(#smoke_*) & not (binary(=smoke_exec) | binary(=smoke_exec_stdin) | binary(=smoke_up_idempotent) | binary(=smoke_down) | binary(=smoke_spinner) | binary(=smoke_lifecycle))'
test-group = 'smoke-lite'

[[profile.dev-fast.overrides]]
filter = 'binary(=smoke_cli)'
test-group = 'smoke-cli'

[[profile.dev-fast.overrides]]
filter = 'binary(=up_dotfiles)'
test-group = 'docker-exclusive'

[[profile.dev-fast.overrides]]
filter = 'binary(=up_prebuild) | binary(=run_user_commands_prebuild) | binary(=run_user_commands_feature_lifecycle) | binary(=lifecycle_parallel_output) | binary(=up_reconnect_full_id) | binary(=up_keepalive_path)'
test-group = 'docker-exclusive'

# integration_auto_forward binds real host ports — serialize it (see default profile).
[[profile.dev-fast.overrides]]
filter = 'binary(=integration_auto_forward)'
test-group = 'docker-exclusive'

# Build consistency tests use Docker buildx and can conflict with parallel builds
[[profile.dev-fast.overrides]]
filter = 'binary(=build_consistency)'
test-group = 'docker-exclusive'

[[profile.dev-fast.overrides]]
filter = 'binary(#parity_*) & not (binary(=parity_harness_faults) | binary(=parity_hermetic) | binary(=parity_registry))'
test-group = 'parity'

[[profile.dev-fast.overrides]]
filter = 'binary(=parity_hermetic) | binary(=parity_registry)'
test-group = 'parity-cli'

# Hermetic harness self-tests + parity-harness integration tests (018 US5, T046):
# fs-heavy; the rest stay ungrouped. NONE are selected by [profile.parity].
[[profile.dev-fast.overrides]]
filter = 'binary(=parity_harness_faults) | binary(=raw_outputs) | binary(=observation_faults) | binary(=container_state_channel) | binary(=prereq_faults)'
test-group = 'fs-heavy'
[[profile.dev-fast.overrides]]
filter = 'binary(#integration_env_probe_*)'
test-group = 'docker-shared'

[[profile.dev-fast.overrides]]
filter = 'binary(=integration_exec_selection) | binary(=integration_exec_id_label)'
test-group = 'docker-shared'
slow-timeout = { period = "5m", terminate-after = 1 }

# integration_up_build_options tests are CLI-only (no actual Docker container operations)
[[profile.dev-fast.overrides]]
filter = 'binary(=integration_up_build_options)'
test-group = 'smoke-cli'
slow-timeout = "60s"

# integration_up_with_features' three Docker tests all bring up the SAME example
# workspace (examples/up/with-features), so they derive the same container identity and
# therefore the same container name. Under `docker-slow-shared` (2 threads) two of them
