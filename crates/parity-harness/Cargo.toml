[package]
name = "parity-harness"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Dev-only support crate for the deacon parity test harness: oracle resolution + exact-version verification, bounded CLI execution with raw capture, the single normalization module, the case loader, and run-report fragments. Never published."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `sync` is additive over the workspace feature set: the resource-group drivers bound
# their concurrency with a `tokio::sync::Semaphore` over a `JoinSet` (024 T018).
# `rt`/`macros`/`time`/`process` back the bounded CLI execution: every invocation is a
# `tokio::time::timeout` over a `tokio::process` child.
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "process"] }
tracing = { workspace = true }
# RFC3339 report timestamps. Not a [workspace.dependencies] entry (only used by
# deacon-core today), so pinned directly here; `clock` (default) provides Utc::now.
chrono = "0.4"
# Parses `.config/nextest.toml` in the lane cross-check (registry.rs) so profile-filter
# drift fails structurally rather than by review.
toml = "0.8"
# Declarative conformance runner (022): the `matches` stdout/stderr assertion is a
# regex match; `regex` is already a [workspace.dependencies] entry (used by core).
regex = { workspace = true }
# Case content digests (case_hash.rs). Already a workspace dependency (deacon-core).
sha2 = { workspace = true }
# Declaration-ordered maps in the case model + run provenance.
indexmap = { version = "2", features = ["serde"] }
# Isolated external temp workspaces for Docker-backed conformance cases (022 US5,
# workspace.rs). Runtime dep now (not just dev): the RAII cleanup guard owns a TempDir.
tempfile = { workspace = true }

# `tempfile` is a runtime dependency above (the RAII cleanup guard owns a TempDir), so it
# is already available to tests; repeating it here would be a second place to bump.
[dev-dependencies]

[lints]
workspace = true
