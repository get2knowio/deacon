name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 07:00 UTC — surfaces new advisories without spamming PRs.
    # Only the `security` job runs on this trigger; see job-level `if` guards.
    - cron: '0 7 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Security (cargo deny)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny

    - name: Run cargo deny
      run: cargo deny check

  lint:
    name: Lint (fmt + clippy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt,clippy

    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Compile (check)
      run: cargo check --workspace --all-targets

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run doctests
      run: cargo test --doc --workspace

  # Every OPEN issue asserting a deacon-vs-reference difference must be cited by a behavior
  # row in parity/SPEC_STATUS.md. This is the half `check_spec_status_census` cannot cover:
  # that check compares the Summary header against the rows, which is arithmetic over what
  # IS written and is silent about what is missing. #580 was filed on 2026-08-13 with no
  # row, so the ledger read "0 open nonconformance" for two days with a measured, unfixed
  # defect in the tracker, and nothing failed.
  #
  # A separate job rather than a step in `lint` on purpose: this is the one check here that
  # needs the GitHub API, and folding it into an already-REQUIRED job would let an API
  # outage block every pull request on something unrelated to the code.
  #
  # NOT a required check until branch protection says so — adding it there is the
  # maintainer's call.
  ledger-coverage:
    name: Ledger (issue coverage)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    # `--limit 1000` is a deliberate ceiling far above this repository's steady state
    # (~15 open issues). `gh issue list` truncates SILENTLY at its limit, and a truncated
    # list would drop obligations without saying so — the one failure mode this job cannot
    # be allowed to have. Raise it before it can bind, never trim it to "what we need".
    #
    # `gh` owns the credentials and the pagination; the Rust side owns the decision. It
    # exits 1 when an obligation is undischarged and 2 when it could not run at all
    # (unreadable ledger, unparseable or EMPTY issue list) — an empty list is a failed
    # query, never a vacuous pass.
    #
    # `--example`, not `--bin`: a second `[[bin]]` anywhere in the workspace makes a bare
    # `cargo run -- <subcommand>` ambiguous, and that is the documented developer loop.
    # See the guard's own module docs for why this target lives in `examples/`.
    - name: Check every open parity issue has a SPEC_STATUS.md row
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue list --state open --limit 1000 \
          --json number,title,labels \
          --jq '[.[] | {number, title, labels: [.labels[].name]}]' \
          | cargo run -q -p parity-harness --example ledger-issue-coverage

  msrv:
    name: MSRV (cargo check)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

    - name: Checkout code
      uses: actions/checkout@v7

    # Pin to the declared MSRV (rust-version in [workspace.package]). If this
    # job fails, either fix the offending code or bump rust-version in lockstep.
    - name: Install MSRV toolchain (1.95)
      uses: dtolnay/rust-toolchain@1.95

    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-msrv-
          ${{ runner.os }}-cargo-

    - name: Check on MSRV
      run: cargo check --workspace --all-targets --all-features --locked

  test-fast:
    name: Test (MVP fast) (${{ matrix.os }})
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runs_on: ubuntu-latest
          - os: macos
            runs_on: macos-14
          # Windows runs the dev-fast profile, which already EXCLUDES Docker /
          # smoke / testcontainers tests — so no Docker daemon is required here.
          # This exercises the platform-agnostic logic (config parse/merge,
          # substitution, OCI ref parsing, path handling) on Windows, the binary
          # we ship but otherwise never test. Container behavior on Windows
          # remains unverified (no Docker on the runner).
          - os: windows
            runs_on: windows-latest
    steps:
    - name: Free disk space (Ubuntu)
      if: matrix.os == 'ubuntu'
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nextest-
          ${{ runner.os }}-cargo-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Run MVP fast tests
      # --no-fail-fast: report ALL failures in one run rather than aborting at the
      # first (matters most for the Windows lane, where we want the complete
      # cross-platform failure set, not just the earliest).
      run: cargo nextest run --profile dev-fast --no-fail-fast

    # `parity_hermetic` is selected by `dev-fast` on every leg of this matrix (#441 removed
    # its Linux gate), so this lane also owes its evidence on failure (#474).
    #
    # `parity_registry` is NOT, and that is the point of it (#544): this job has no Docker
    # setup, no prepull and no GHCR token, so a case that resolves an OCI Feature has no
    # business gating on it. Six such cases sat in `parity_hermetic` and passed here only
    # because the runner has network. They gate on `Test (MVP integration)` below instead,
    # which acquires a read-only GHCR bearer token. Do NOT add `binary(=parity_registry)`
    # to the `dev-fast` `default-filter`'s exception list.
    #
    # The name
    # carries the matrix leg because one run's artifacts share a namespace;
    # `if-no-files-found: ignore` guards the legs that fail before the parity binary runs
    # and therefore wrote no `target/parity/`.
    - name: Upload parity evidence
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: parity-evidence-fast-${{ matrix.os }}
        path: target/parity/
        if-no-files-found: ignore

  test-integration:
    name: Test (MVP integration)
    if: github.event_name != 'schedule'
    needs: test-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEACON_NETWORK_TESTS: "1"
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nextest-
          ${{ runner.os }}-cargo-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Ensure Docker is running and clean
      run: |
        sudo service docker start
        docker info
        sudo docker system prune -af --volumes
        sudo docker builder prune -af

    # An EXPLICIT engine precondition, in the same spirit as `parity.yml`'s BuildKit
    # assertion: `parity_docker` runs here as a blocking PR lane, and its case data pins
    # capabilities MEASURED on a modern engine. The runner's preinstalled Docker is older,
    # and buildx's default `docker` driver on it cannot perform several exports — which
    # showed up twice as a "divergence" that was really the substrate:
    #   * `case-build-cache-to-flag` with `--cache-to type=local` (now `type=inline`), and
    #   * `case-build-output-export-tar` with `--output type=docker,dest=…`, which has no
    #     portable reformulation because exporting a tar IS its subject.
    # Establishing the engine here is what lets those cases assert an outcome instead of
    # tolerating "succeeded OR failed".
    #
    # Pinned, never floating: `29.6.2` is the exact engine the suite's capability pins were
    # measured on. Raising it is a deliberate, verify-first change, not a drift.
    - name: Pin a modern Docker engine (capability precondition)
      uses: docker/setup-docker-action@v5
      with:
        version: v29.6.2
        set-host: true

    - name: Verify the pinned engine and its exporter capability
      # Fail LOUD and early rather than letting a `build` case report a divergence that is
      # really a missing exporter. Probes the capability itself, not just the version.
      run: |
        set -euo pipefail
        docker version
        probe="$(mktemp -d)"
        printf 'FROM alpine:3.18\n' > "$probe/Dockerfile"
        if ! docker buildx build --output "type=docker,dest=$probe/probe.tar" "$probe"; then
          echo "::error::MACHINERY PRECONDITION FAILED (not a parity divergence): this engine cannot export \`type=docker,dest=…\`. The pinned parity cases assume it. Fix the engine pin above; do not weaken the case data."
          exit 1
        fi
        test -s "$probe/probe.tar"
        echo "engine exporter capability verified"

    - name: Acquire GHCR bearer token (read-only)
      run: |
        set -euo pipefail
        TOKEN_URL="https://ghcr.io/token?service=ghcr.io\
        &scope=repository:devcontainers/features/node:pull\
        &scope=repository:devcontainers/features/common-utils:pull\
        &scope=repository:devcontainers/features/docker-in-docker:pull\
        &scope=repository:devcontainers/features/python:pull\
        &scope=repository:devcontainers/features/git:pull"
        TOKEN=$(curl -fsSL "$TOKEN_URL" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')
        if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "Failed to acquire GHCR token" >&2
          exit 1
        fi
        echo "DEACON_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    # This token is also what makes `parity_registry` gate a pull request HERE rather than
    # on `Test (MVP fast)` (#544). The `mvp-integration` profile selects it through its
    # `binary(#parity_*)` clause; the six registry-reaching cases split out of
    # `parity_hermetic` therefore still gate every pull request, on the job actually
    # provisioned for a registry. If that clause is ever narrowed, they stop gating
    # anything — check `cargo nextest list -E 'binary(=parity_registry)' --profile
    # mvp-integration` before touching it.
    - name: Run MVP integration tests
      run: make test-nextest-mvp-integration

    # The evidence for the parity binaries this job runs (#474). `parity.yml` has always
    # uploaded `target/parity/`, but that lane GATES NOTHING — the two lanes that gate a pull
    # request run here, and until now they retained nothing but a 267-byte timing file. Both
    # CI occurrences of the #470 export-tar flake were therefore undiagnosable after the fact,
    # and #470's own "download the evidence before rerunning" instruction was unfollowable.
    #
    # `if: failure()` rather than `always()`: this lane runs on every pull request, and a
    # green run's raw capture is not worth the storage. `if-no-files-found: ignore`, because a
    # failure BEFORE the harness runs (a cache miss, a compile error, the engine precondition
    # above) leaves no tree, and a missing artifact must not become a second failure obscuring
    # the first.
    - name: Upload parity evidence
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: parity-evidence-mvp-integration
        path: target/parity/
        if-no-files-found: ignore

    - name: Upload timing artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nextest-mvp-integration-timing
        path: artifacts/nextest/mvp-integration-timing.json
        if-no-files-found: warn

  # Podman parity lane. deacon's PodmanRuntime drives the `podman` CLI directly;
  # this runs the full integration suite against a real rootless `podman` (via
  # DEACON_CONTAINER_RUNTIME=podman). Promoted from experimental to REQUIRED once
  # the lane reached 163/163 — the image-ref qualification, runtime selection
  # across the consumer surface, and podman `ps`-JSON parsing fixes landed
  # (issue #30). Remaining 1.1 items (rootless userns/uidmap, label=disable,
  # podman-aware GPU info) are non-blocking polish, tracked on #30.
  test-podman:
    name: Test (Podman)
    if: github.event_name != 'schedule'
    needs: test-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEACON_CONTAINER_RUNTIME: podman
      DEACON_NETWORK_TESTS: "1"
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nextest-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nextest-
          ${{ runner.os }}-cargo-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Set up Podman (rootless)
      run: |
        sudo apt-get update
        sudo apt-get install -y podman
        podman version
        # deacon's PodmanRuntime drives the `podman` CLI directly, and for every
        # subcommand except compose that is the whole story.
        # Sanity-check rootless pull + run before the suite.
        podman run --rm docker.io/library/alpine:3.18 echo "podman-ok"

        # COMPOSE needs an API socket, and this step used to say "no socket".
        # `podman compose` is a shim: it execs an external provider — docker-compose,
        # already on the runner — and points it at podman by exporting
        # DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock. MEASURED by pointing
        # `compose_providers` at a script that dumps its environment; it also sets
        # DOCKER_BUILDKIT=0 and blanks DOCKER_CONFIG. With nothing listening, EVERY
        # compose call fails with `Cannot connect to the Docker daemon`, which is a
        # fact about this job's setup and not about deacon. Started directly rather
        # than through `systemctl --user`, so the lane does not depend on a user
        # systemd session existing on the runner image.
        export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
        mkdir -p "$XDG_RUNTIME_DIR/podman"
        setsid podman system service --time=0 \
          "unix://$XDG_RUNTIME_DIR/podman/podman.sock" \
          > "$RUNNER_TEMP/podman-service.log" 2>&1 < /dev/null &
        for _ in $(seq 1 25); do
          curl -sf --max-time 2 --unix-socket "$XDG_RUNTIME_DIR/podman/podman.sock" \
            http://d/v1.41/_ping >/dev/null 2>&1 && break
          sleep 0.4
        done
        curl -sf --max-time 5 --unix-socket "$XDG_RUNTIME_DIR/podman/podman.sock" \
          http://d/v1.41/_ping >/dev/null \
          || { echo "podman API socket never came up"; cat "$RUNNER_TEMP/podman-service.log"; exit 1; }
        echo "podman API socket ready"
        echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

    - name: Acquire GHCR bearer token (read-only)
      run: |
        set -euo pipefail
        TOKEN_URL="https://ghcr.io/token?service=ghcr.io\
        &scope=repository:devcontainers/features/node:pull\
        &scope=repository:devcontainers/features/common-utils:pull\
        &scope=repository:devcontainers/features/docker-in-docker:pull\
        &scope=repository:devcontainers/features/python:pull\
        &scope=repository:devcontainers/features/git:pull"
        TOKEN=$(curl -fsSL "$TOKEN_URL" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')
        echo "DEACON_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    # `parity_docker` is excluded here, and that is a SELECTION rather than a skip — the
    # same truthful-by-non-selection principle that keeps `parity_differential` off every
    # machine without the pinned oracle. The parity harness probes the
    # container runtime through the literal `docker` CLI (`workspace.rs` discovery and
    # reclamation, `observe/mod.rs` container probe) and its case data is Docker-MEASURED.
    # Under `DEACON_CONTAINER_RUNTIME=podman` deacon creates a podman container that a
    # `docker` probe cannot see, so every case can only ever "observe nothing" — a failure
    # about the substrate, never about deacon. Measured: `case-down-dockerfile-workspace`
    # reported exactly that ("op-up succeeded but no container carries the label
    # devcontainer.local_folder=…").
    #
    # The filterset INTERSECTS with the profile's `default-filter`, so this removes exactly
    # the two `parity_docker` tests and leaves the rest — the same set that already passes
    # here. `parity_registry` is unaffected (runtime-agnostic), and this job acquires the
    # GHCR token it needs.
    #
    # `parity_hermetic` and `parity_registry` are runtime-agnostic.
    #
    # NOTE (#694): this job now exercises `deacon build` on podman for the FIRST time.
    # It always ran the `build` tests and cases, but `build` hardcoded `CliDocker::new()`
    # at four sites, so every one of them silently used docker no matter what this job
    # selected — a green lane reporting coverage it did not have. `build` now takes the
    # resolved runtime (flavor AND binary), so whatever these report is real. If they
    # fail, that is genuine podman work for #30, not a regression in the fix that made
    # them honest.

    - name: Run integration suite against Podman (full failure set)
      run: cargo nextest run --profile mvp-integration --no-fail-fast -E 'not binary(=parity_docker)'

    # `test_compose_override_command_lifecycle_runs` fails here intermittently with
    #   container create failed (no logs from conmon): conmon bytes ""
    # which is podman failing to START an exec session's conmon, not a deacon error —
    # it surfaces as a bare `deacon up failed` and reads like a lifecycle defect.
    #
    # TWO hypotheses have been tested and REFUTED, which is why this step exists
    # instead of a third guess (#723):
    #   - CONTENTION. `smoke-lite` was halved to 2 (#718); the failure recurred
    #     unchanged, and the change was reverted.
    #   - CONTAINER NOT RUNNING. `get_primary_container_id` matches a service by name
    #     with no state check, so a not-yet-running container looked plausible.
    #     Measured locally against rootless podman 4.9.3: exec into an EXITED compose
    #     container gives `can only create exec sessions on running containers:
    #     container state improper` — a clean, DIFFERENT error. Not this.
    #
    # It has never reproduced locally, so the next occurrence has to carry its own
    # evidence. `if: failure()` and `|| true` throughout: this reports, it never fails
    # the job, and it must not mask the real failure.
    - name: Podman diagnostics (#723)
      if: failure()
      run: |
        echo "=== memory / load at failure ==="
        free -m || true
        uptime || true
        echo "=== process and fd ceilings, which conmon needs to fork ==="
        ulimit -a || true
        echo "  pids.max: $(cat /sys/fs/cgroup/pids.max 2>/dev/null || echo n/a)"
        echo "=== conmon ==="
        command -v conmon && conmon --version || echo "  conmon NOT on PATH"
        echo "=== podman's own view ==="
        podman info --format '{{json .Host}}' 2>&1 | head -c 2000 || true
        echo
        echo "=== containers still around (states are the point) ==="
        podman ps -a --format '{{.ID}} {{.Status}} {{.Names}}' || true
        echo "=== kernel ring buffer, for an OOM kill ==="
        sudo dmesg 2>/dev/null | tail -40 || echo "  dmesg unavailable"

    # `deacon build` on podman, which nothing exercised until now (#30).
    #
    # The step above cannot cover it: `mvp-integration`'s `default-filter` excludes
    # every `integration_build*` binary, and a `-E` filterset INTERSECTS with that
    # filter rather than widening it. So this is a separate invocation with
    # `--ignore-default-filter`, naming exactly the build binaries.
    #
    # Until #697 there was nothing to gain by running them here — `build`
    # hardcoded `CliDocker::new()` and used docker no matter what this job
    # selected, so they would have reported on docker while sitting in a lane
    # labelled podman.
    #
    # #697 fixed the SELECTION but not the EXECUTION, and this comment used to say
    # otherwise. `execute_docker_build` took the resolved runtime, spent it on
    # `check_docker_installed()`/`ping()`, then ran `Command::new("docker")` — so
    # the builds here still landed on docker, in a step labelled Podman, exactly
    # the failure this file warns about two paragraphs down. #708 fixed that; a
    # shim test (`build_runtime_routing`) now holds the line hermetically. Reports
    # from this step are trustworthy from #708 onward, and earlier ones — including
    # the `smoke_build_json_then_text` evidence once cited here — are not.
    #
    # BLOCKING on purpose. A non-blocking step here would recreate exactly the
    # thing #694 fixed: a green lane reporting coverage it does not have.
    # WHAT THIS STEP EXCLUDES, and why the list grew. #708 made the builds actually
    # run on podman, which turned a false 34/34 into a true 24 passed / 10 failed.
    # Four of those ten were TEST defects and are fixed: integration_build{,_output}
    # verified what deacon produced by shelling out to a hardcoded `docker`, reading
    # a different image store than the deacon under test wrote to. They now use a
    # `runtime_bin()` helper honoring DEACON_CONTAINER_RUNTIME.
    #
    # The rest are excluded, in two groups.
    #
    # (1) THREE buildx EXPORTER capability gaps. `podman buildx` is an alias for
    # `podman build`, which supports neither BuildKit's exporter grammar nor its
    # cache-export grammar, so each of these fails in podman's own parser before
    # deacon is involved. Docker-only by nature, not deacon defects:
    #   concurrent_identical_builds_…                        --output type=docker
    #     "Docker exporter is not supported for the docker driver"
    #   build_honors_a_container_driver_builder_and_can_oci_export   --output type=oci
    #     "invalid type \"oci\" selected for build output options"
    #   …_and_can_export_a_local_cache                     --cache-to type=local
    #     podman parses the whole value as a repo: "must contain registry and
    #     repository: invalid reference format"
    #
    # `integration_compose_features_build` USED to be excluded here in full — every
    # one of its seven tests failed under podman — and it is back in because #710
    # fixed the cause. That cause was NOT the one this comment used to assert, so
    # the correction is worth keeping: the hypothesis on record was that podman
    # delegates compose to an external `docker-compose` which then talks to the
    # DOCKER daemon. Measured directly, podman does the opposite — it points the
    # provider at its own socket, exporting `DOCKER_HOST=unix:///run/podman/podman.sock`
    # (and `DOCKER_BUILDKIT=0`) into the provider's environment.
    #
    # deacon never reached that delegation. `deacon build`'s compose path built its
    # `ComposeManager` with `ComposeManager::new()`, whose `docker_path` defaults to
    # the literal "docker", and `up`/`down`/`exec`/`read-configuration` passed the
    # raw `--docker-path` flag — which `binary_for` maps to the flavor's own name
    # only INSIDE `resolve_runtime`, so under `--runtime podman` it still read
    # "docker". So deacon ran `docker compose` itself: the service image landed in
    # DOCKER's store and every podman-side step after it missed.
    #
    # Measured with a shim on `--docker-path`, before: the named runtime received
    # `-v`, `image inspect` and `tag`, and ZERO `compose` invocations. After: three,
    # the service build among them. `build_runtime_routing` guards both axes
    # hermetically and needs no daemon.
    #
    # Two `localhost/` fixes were tried against the old diagnosis and both were
    # measured wrong. Neither could have worked, because the image was in another
    # daemon entirely — a naming fix for a routing bug.
    #
    # (3) THREE of that binary's seven stay excluded, on a fourth capability gap
    # rather than a deacon defect. Podman sets `DOCKER_BUILDKIT=0` for the compose
    # provider (measured, same environment dump as above), which pins docker-compose
    # to the classic builder; deacon's Feature-extended compose build passes the
    # Feature content as an ADDITIONAL BUILD CONTEXT, which only BuildKit supports:
    #   the classic builder doesn't support additional contexts, set DOCKER_BUILDKIT=1
    # Only the `build:`-shape services hit it. The `image:` shape builds its Feature
    # image with `podman build` directly and passes — which is
    # `compose_features_image_shape_installs_feature`, the test #706 was originally
    # filed about.
    #
    # MEASURED locally against real rootless podman 4.9.3 (see the devcontainer
    # podman setup): 4 of 7 pass, and the 3 below fail with that one message.
    - name: Run build tests against Podman (#30)
      run: |
        cargo nextest run --profile mvp-integration --no-fail-fast \
          --ignore-default-filter \
          -E '(binary(=integration_build) | binary(=integration_build_output)
               | binary(=integration_compose_features_build))
              - test(=concurrent_identical_builds_do_not_race_on_the_shared_deterministic_tag)
              - test(=build_honors_a_container_driver_builder_and_can_oci_export)
              - test(=build_honors_a_container_driver_builder_and_can_export_a_local_cache)
              - test(=build_compose_with_features_tags_final_image)
              - test(=build_compose_with_features_keeps_the_services_own_build_keys)
              - test(=compose_features_build_shape_installs_feature)'

    # `parity_hermetic` runs in this job (it is runtime-agnostic and NOT excluded above), so
    # this job owes the same evidence as the Docker one (#474). Same conditions, same reasons;
    # a distinct artifact name because two jobs of one run cannot share one.
    - name: Upload parity evidence
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: parity-evidence-podman
        path: target/parity/
        if-no-files-found: ignore
