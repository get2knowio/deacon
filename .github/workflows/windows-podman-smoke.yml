# Non-required Windows + Podman smoke lane (issue #239).
#
# A nightly (+ manually dispatchable) end-to-end check that a GitHub-hosted
# windows-latest runner can host `podman machine` (WSL2 backend) and run a
# minimal `deacon up → exec → down` against a Linux image. The feasibility
# spike (#239) proved this works once; this lane runs it on a schedule to
# gather RELIABILITY data before deciding whether to promote it to a required
# check (mirroring how the Linux podman lane went #236 experimental → #237
# required).
#
# NOT a PR gate: it never runs on push/PR (no per-PR Windows-runner cost) and
# nothing depends on it. A failing nightly is the signal we're collecting —
# check the run's step summary for the layer-by-layer breakdown. The
# workflow_dispatch trigger keeps it runnable on demand as a diagnostic.
name: Windows + Podman smoke (#239)

on:
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      podman_cli_version:
        description: 'podman-cli Chocolatey version to install instead of the pin (diagnostic; empty = pin)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Overlapping nightlies replace each other; a manual dispatch (a diagnostic, a
  # branch verifying itself) gets a group of its own, so it never cancels another
  # dispatch or the nightly.
  group: windows-podman-smoke-${{ github.event_name == 'schedule' && 'nightly' || github.run_id }}
  cancel-in-progress: true

jobs:
  windows-podman-smoke:
    name: Windows + Podman smoke
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DEACON_CONTAINER_RUNTIME: podman
      # A fully-qualified ref sidesteps podman short-name resolution so the lane
      # measures the runtime/mount path, not image qualification.
      SMOKE_IMAGE: docker.io/library/alpine:3.18
      # PINNED. An unpinned `choco install podman-cli` took whatever was newest
      # (6.1.3 on one night, 6.1.4 the next), so a change in podman was
      # indistinguishable from a change in deacon. The Linux lane learned the same
      # lesson in #726. Bump deliberately.
      # This pins the Windows CLIENT only. The machine image it boots
      # (quay.io/podman/machine-os:<major.minor>) is a floating tag whose old
      # digests quay garbage-collects within weeks, so it cannot be pinned; what
      # the lane needs from that image is checked in the machine step (#774).
      PODMAN_CLI_VERSION: ${{ inputs.podman_cli_version || '6.1.4' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Host diagnostics
      # Purely informational. `wsl --status` exits non-zero when no distro is
      # installed (the runner default), so force Continue + `exit 0` so this can
      # never abort the run.
      continue-on-error: true
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host "== OS =="
        [System.Environment]::OSVersion.Version | Out-String
        (Get-CimInstance Win32_OperatingSystem).Caption
        Write-Host "== WSL =="
        wsl --version 2>&1 | Out-String
        wsl --status 2>&1 | Out-String
        wsl --list --verbose 2>&1 | Out-String
        Write-Host "== Virtualization =="
        (Get-CimInstance Win32_Processor).VirtualizationFirmwareEnabled | Out-String
        Write-Host "== podman preinstalled? =="
        (Get-Command podman -ErrorAction SilentlyContinue | Out-String)
        exit 0

    - name: Ensure WSL2
      id: wsl
      continue-on-error: true
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        # Ensure the WSL2 platform is present (podman machine brings its own
        # distro, so --no-distribution is enough). If a reboot is ever required,
        # `podman machine start` below fails and that becomes the recorded
        # finding.
        wsl --install --no-distribution 2>&1 | Out-String
        wsl --update 2>&1 | Out-String
        wsl --set-default-version 2 2>&1 | Out-String
        exit 0

    - name: Install Podman client (if needed)
      id: install
      continue-on-error: true
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        if (-not (Get-Command podman -ErrorAction SilentlyContinue)) {
          Write-Host "podman not on PATH; installing via Chocolatey"
          choco install podman-cli --version $env:PODMAN_CLI_VERSION -y --no-progress
        } else {
          Write-Host "podman already present"
        }
        $env:Path += ";C:\Program Files\RedHat\Podman"
        echo "C:\Program Files\RedHat\Podman" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        podman --version 2>&1 | Out-String
        exit 0

    - name: Init + start podman machine (WSL2 backend)
      id: machine
      continue-on-error: true
      shell: pwsh
      run: |
        # Accurate exit semantics: this step's outcome must reflect whether the
        # WSL2-backed machine actually came up. Fail fast on init/start so the
        # captured error is the real blocker, not a later symptom.
        podman machine init 2>&1 | Out-String
        if ($LASTEXITCODE -ne 0) { Write-Host "podman machine init FAILED"; exit 1 }
        podman machine start 2>&1 | Out-String
        if ($LASTEXITCODE -ne 0) { Write-Host "podman machine start FAILED"; exit 1 }

        # #774: under WSL 2.9+ the machine's cgroups sit in a `non-systemd`
        # subtree (microsoft/WSL#41492), so a rootless container scope created
        # through systemd gets no `pids` controller and every `podman run` fails
        # with "crun: controller `pids` is not available". podman-machine-os
        # answered by defaulting WSL images to cgroup_manager=cgroupfs
        # (podman-machine-os#329, in machine-os:6.1 from 6.1.4 on); the client
        # pin above had nothing to do with it. Apply the same setting whenever
        # the image we booted lacks it, so the lane stays rootless (what Windows
        # users get by default) whichever image the floating tag serves.
        $hostInfo = (podman info --format json | ConvertFrom-Json).host
        $controllers = @($hostInfo.cgroupControllers)
        Write-Host "cgroupManager=$($hostInfo.cgroupManager) cgroupControllers=[$($controllers -join ',')] rootless=$($hostInfo.security.rootless)"
        $cgroups = "$($hostInfo.cgroupManager) (image default)"
        if ($hostInfo.cgroupManager -eq 'systemd' -and $controllers -notcontains 'pids') {
          Write-Host "::warning title=podman machine cgroups (#774)::systemd cgroup manager with no pids controller delegated; switching the machine to cgroup_manager=cgroupfs"
          # base64 keeps the TOML quotes out of the pwsh -> ssh -> sh quoting.
          $conf = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("[engine]`ncgroup_manager = `"cgroupfs`"`n"))
          podman machine ssh "mkdir -p ~/.config/containers/containers.conf.d && echo $conf | base64 -d > ~/.config/containers/containers.conf.d/50-wsl-cgroupfs.conf" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "writing the cgroupfs drop-in FAILED"; exit 1 }
          podman machine stop 2>&1 | Out-String
          podman machine start 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "podman machine restart FAILED"; exit 1 }
          $manager = (podman info --format json | ConvertFrom-Json).host.cgroupManager
          if ($manager -ne 'cgroupfs') { Write-Host "cgroup manager is still '$manager' after the drop-in"; exit 1 }
          $cgroups = "cgroupfs (#774 workaround applied)"
        }
        "cgroups=$cgroups" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

        Write-Host "== podman info =="
        podman info 2>&1 | Out-String

    - name: Podman smoke (run alpine)
      id: smoke
      continue-on-error: true
      shell: pwsh
      run: |
        # This step's outcome gates the deacon e2e below. deacon has not even
        # been built yet, so a failure here is the podman substrate, and the
        # annotation says so on the run page.
        $out = podman run --rm $env:SMOKE_IMAGE echo "podman-windows-ok" 2>&1 | Out-String
        $code = $LASTEXITCODE
        Write-Host $out
        if ($code -ne 0) {
          $cause = $out -split "`r?`n" | Where-Object { $_ -match 'Error' } | Select-Object -Last 1
          Write-Host "::error title=Podman environment (not deacon)::podman run $env:SMOKE_IMAGE failed (exit $code) before deacon ran: $cause"
          exit 1
        }

    # ---- deacon e2e (only attempted if the podman backend actually works) ----

    - name: Install Rust toolchain
      if: steps.smoke.outcome == 'success'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry and target
      if: steps.smoke.outcome == 'success'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-winpodman-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-winpodman-
          ${{ runner.os }}-cargo-

    - name: Build deacon
      id: build
      if: steps.smoke.outcome == 'success'
      continue-on-error: true
      run: cargo build -p deacon

    - name: deacon up - exec - down against Podman
      id: e2e
      if: steps.smoke.outcome == 'success' && steps.build.outcome == 'success'
      continue-on-error: true
      # Its own budget, well under the job's. `deacon up` once printed success and
      # then never exited (#239), and with only the job timeout that read as a
      # "cancelled" run rather than as this step failing.
      timeout-minutes: 10
      shell: bash
      run: |
        set -x
        ws="$RUNNER_TEMP/winpodman-ws"
        mkdir -p "$ws/.devcontainer"
        cat > "$ws/.devcontainer/devcontainer.json" <<JSON
        { "name": "win-podman-smoke", "image": "$SMOKE_IMAGE", "overrideCommand": true }
        JSON
        bin="target/debug/deacon.exe"
        "$bin" up --workspace-folder "$ws" --skip-post-create --skip-non-blocking-commands
        "$bin" exec --workspace-folder "$ws" -- echo "deacon-podman-windows-e2e-ok"
        "$bin" down --workspace-folder "$ws"

    - name: Smoke summary
      if: always()
      shell: bash
      run: |
        {
          echo "## Windows + Podman smoke (#239)"
          echo ""
          echo "| Layer | Outcome |"
          echo "|---|---|"
          echo "| Ensure WSL2 | ${{ steps.wsl.outcome }} |"
          echo "| Install podman client | ${{ steps.install.outcome }} |"
          echo "| podman machine init + start | ${{ steps.machine.outcome }} |"
          echo "| machine cgroup manager | ${{ steps.machine.outputs.cgroups }} |"
          echo "| podman run alpine (smoke) | ${{ steps.smoke.outcome }} |"
          echo "| cargo build -p deacon | ${{ steps.build.outcome }} |"
          echo "| deacon up/exec/down | ${{ steps.e2e.outcome }} |"
          echo ""
          echo "Non-required reliability lane. A failing nightly is the signal we're"
          echo "collecting before deciding whether to promote this to a required check"
          echo "(#239). See the step logs above for the captured failure mode of any"
          echo "non-\`success\` layer."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Reflect e2e conclusion
      if: always()
      shell: bash
      run: |
        # Job is green only if the full e2e worked; otherwise fail so the run
        # conclusion honestly reflects the reliability data point (diagnostics
        # are already captured in the summary + logs above).
        if [ "${{ steps.e2e.outcome }}" = "success" ]; then
          echo "deacon up/exec/down succeeded under Windows podman"
        elif [ "${{ steps.machine.outcome }}" != "success" ] || [ "${{ steps.smoke.outcome }}" != "success" ]; then
          echo "::error title=Podman environment (not deacon)::podman machine or a plain podman run failed, so deacon was never exercised; see the summary for the failing layer."
          exit 1
        else
          echo "::error title=deacon::podman works on this runner, but cargo build or deacon up/exec/down failed; see the summary for the failing layer."
          exit 1
        fi
