# Exploratory parity discovery (025-exploratory-parity-discovery, US3/T058).
#
# The THIRD lane. `ci` answers "did this change break something we already assert";
# `parity / live-certification` answers "does deacon still match the reference on the
# cases we curated"; this one answers the question neither can — "does anything differ
# outside what we curated?".
#
# ## This lane GATES NOTHING
#
# A campaign that finds forty differences exits 0. Only a *machinery* failure — an
# unverifiable oracle, a normalization failure, an unwritable or invalid data root — is
# non-zero (FR-058, contracts/discovery-cli.md). That rule is the entire reason this lane
# can be scheduled in CI at all: a status that depended on findings would be a stochastic
# gate, and green would stop being reproducible. Nothing here is in the release path, and
# a red run here blocks no pull request and no release.
#
# ## Why there is no `pull_request` trigger
#
# FR-055 is absolute: no discovery program may be selected by, or run in, a pull-request
# lane. Adding a PR trigger "just to lint the workflow" would be the first step toward a
# campaign running on a PR. The wiring is instead guarded *hermetically* on every PR by
# `parity_registry_check` (registry ↔ `tests/*.rs` ↔ `.config/nextest.toml` agreement,
# and that `deacon --help` gains no discovery surface) and by `discovery_hermetic`, both
# of which run in the fast lane and need no oracle, Docker, or network.
#
# ## Cadence — two schedules, two jobs, two budgets
#
# **Nightly (`0 7 * * *`)**, offset from the parity lane's 05:00 so the two do not contend
# for runners. The hermetic configuration-resolution tier gets the whole nightly budget: at
# the clarified per-candidate ceilings a single container-backed candidate can consume a
# sixth of the 30-minute window, so sharing one budget lets the slow tier starve the fast
# one — and the fast tier is where nearly all the exploration happens (research D10).
#
# **Weekly (`0 9 * * 0`)**, the network-backed **corpus** canary, on a schedule of its own
# (T128, FR-056). It is separate from the nightly campaign rather than folded into it for
# two reasons. It must exist at all: US7 calls the corpus an *ecological canary*, and a
# canary that runs only when someone remembers to invoke it cannot warn anyone. And it must
# be weekly rather than nightly: the corpus changes only when someone re-pins it, so nightly
# runs would mostly re-confirm the previous night at network cost, while the signal being
# watched for — the ecosystem drifting away from what deacon handles — moves on the order of
# weeks (research D10).
#
# The container-backed tier remains explicitly invoked only, via `workflow_dispatch`.
name: discovery

on:
  schedule:
    # Nightly exploratory campaign on the default branch (hermetic tier).
    - cron: '0 7 * * *'
    # Weekly real-world corpus canary. Sunday, offset from the nightly hour so the two
    # never overlap even when a nightly run is slow: the `concurrency` group below serializes
    # them, and a corpus run queued behind a 60-minute nightly would report its own budget
    # as exhausted for a reason that has nothing to do with the corpus.
    - cron: '0 9 * * 0'

  # Explicit invocation. FR-056 requires the invoked lane to ACCEPT a seed and a budget
  # and to RECORD both; the campaign records them in `conformance/discovery/campaigns.json`
  # as part of the run's provenance.
  workflow_dispatch:
    inputs:
      seed:
        description: >-
          Hex PRNG seed. Required, never defaulted: a defaulted seed would let a campaign
          run without its reproducibility input being a conscious choice, and FR-001
          depends on the seed being recorded rather than inferred.
        required: true
        type: string
      budget:
        description: 'Wall-clock budget for the campaign, in seconds.'
        required: false
        default: '1800'
        type: string
      tier:
        description: >-
          Which tier to run. `metamorphic` needs no oracle, Docker, or network;
          `config-differential` is the nightly tier; `container-differential` needs Docker;
          `corpus` needs network. Selecting the container tier separately from the
          configuration tier is FR-060.
        required: false
        default: 'config-differential'
        type: choice
        options:
          - config-differential
          - container-differential
          - metamorphic
          - corpus

# Read-only. The campaign writes `conformance/discovery/{findings,campaigns}.json` in the
# workspace and those files are uploaded as an artifact, but this lane deliberately does
# NOT push them: a stochastic process must never author the record it is measured against
# (FR-036). Promotion is a human reading the diff and editing the registry by hand.
permissions:
  contents: read

concurrency:
  # One campaign at a time. Two concurrent runs would write the same data root, and
  # `cancel-in-progress: false` because a partially completed campaign still has findings
  # worth keeping.
  group: discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  campaign:
    name: campaign
    # Everything EXCEPT the weekly corpus cron. Written as an exclusion rather than as
    # "run on the nightly cron or a dispatch" so that adding a third schedule later cannot
    # silently stop this job from running: a new cron would fall through to the nightly
    # campaign, which is the harmless direction. The corpus job below is the one that must
    # be opted into explicitly, because it is the one that reaches the network.
    if: github.event_name != 'schedule' || github.event.schedule != '0 9 * * 0'
    runs-on: ubuntu-latest
    # Above SC-015's 30-minute campaign budget. The budget is enforced by the campaign
    # driver itself, which reports the elapsed number; this is only the backstop for a
    # driver that stops making progress at all. A backstop that fired FIRST would replace
    # a diagnosable failure with "the job was slow".
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-discovery-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-discovery-
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Provision the pinned oracle
        # Install EXACTLY the version in the pin file — the harness re-verifies it, so
        # provisioning and harness can never disagree about the reference. A missing or
        # mismatched oracle FAILS the run; there is no silent skip, because "found
        # nothing" and "never compared anything" must never look alike.
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version fixtures/parity-corpus/oracle.json)"
          echo "Installing @devcontainers/cli@${VERSION} from fixtures/parity-corpus/oracle.json"
          npm install -g "@devcontainers/cli@${VERSION}"

      - name: Verify oracle version
        run: devcontainer --version

      - name: Set up Docker Buildx
        # The container-backed tier builds images; establishing the precondition here (as
        # the parity lane does) keeps a missing builder from being reported as a
        # divergence.
        uses: docker/setup-buildx-action@v3

      - name: Verify BuildKit is available
        run: |
          docker buildx version
          docker buildx inspect --bootstrap >/dev/null
          echo "BuildKit is available"

      - name: Build deacon
        run: cargo build -p deacon

      - name: Prove the pipeline can carry an injected difference
        # FR-042a, run BEFORE the campaign and deliberately so: a campaign that reports no
        # findings and a campaign whose pipeline silently swallows them are byte-identical
        # from the outside, and the only way to tell them apart is to plant a difference
        # you know is there and require it to come out the other end.
        #
        # This is the ONE discovery command whose status depends on an outcome, and it is
        # still not finding-dependent: it asserts a property of the MACHINERY, so non-zero
        # means the pipeline is broken. An injection that never landed also exits 1, as a
        # PROOF defect rather than as "found nothing" — a mis-authored record must never
        # masquerade as a working pipeline.
        #
        # Hermetic: it needs deacon and nothing else. No oracle, no Docker, no network —
        # the counterpart is deacon's own unperturbed run, which is what makes the
        # baseline provably empty and every surfaced difference attributable to the
        # injection.
        run: make test-discovery-proof

      - name: Run the discovery lane
        # The SINGLE sanctioned entry point: `[profile.discovery]`, whose default-filter
        # is an explicit `binary(=…)` allow-list rather than a `discovery_*` glob (the
        # glob would capture the hermetic guards and silently remove them from the fast
        # lane — research D9).
        run: cargo nextest run --profile discovery

      - name: Run the explicitly seeded campaign
        # Only on explicit invocation, where a seed and a budget were supplied. The
        # scheduled lane above runs the profile's own campaign binaries instead.
        #
        # The inputs reach the shell through `env:`, never through `${{ }}` interpolated
        # into the script body. `${{ }}` in a `run:` block is substituted *before* the
        # shell sees the text, so a value containing shell metacharacters becomes code
        # rather than an argument. Requiring write access to dispatch a workflow narrows
        # who can do that; it does not make the substitution safe, and this is the shape
        # that is safe by construction.
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCOVERY_SEED: ${{ inputs.seed }}
          DISCOVERY_TIER: ${{ inputs.tier }}
          DISCOVERY_BUDGET: ${{ inputs.budget }}
        run: |
          cargo run -p parity-harness --bin discovery-campaign -- \
            --seed "$DISCOVERY_SEED" \
            --tier "$DISCOVERY_TIER" \
            --budget-seconds "$DISCOVERY_BUDGET" \
            --lane invoked

      - name: Render the findings queue
        # Never gates: a queue holding fifty untriaged findings still exits 0. The exit
        # status reflects only whether the artifacts could be written.
        run: cargo run -p deacon-conformance -- discovery report

      - name: Validate the discovery data root
        # This one DOES fail the lane, and legitimately so: D1–D5 are integrity classes
        # over the record the campaign just wrote (a malformed record, an unresolvable
        # reference, an undeclared channel, a stale pin). That is a machinery failure, not
        # a finding — the distinction the whole exit-status contract rests on.
        run: cargo run -p deacon-conformance -- discovery check

      - name: Upload the findings queue and campaign artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-queue
          path: target/discovery/
          if-no-files-found: warn

      - name: Upload the written discovery data root
        # The data root is the durable record a reviewer triages from. Uploaded rather
        # than pushed (see the `permissions` note above): review is a human act.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-data-root
          path: conformance/discovery/
          if-no-files-found: warn

  # The weekly real-world corpus canary (T128, FR-056, research D10).
  #
  # A separate job rather than a fifth step of `campaign`, because it has a different
  # cadence, a different prerequisite (the network), and a different budget. Sharing a job
  # would mean sharing a schedule, and the whole point of this one is that the corpus does
  # NOT belong on the nightly clock.
  #
  # It gates nothing, exactly like the campaign job: forty differences against the
  # ecosystem exit 0. Only a machinery failure — an unverifiable oracle, no network, an
  # invalid data root — is non-zero (FR-058). A red run here blocks no pull request and no
  # release.
  #
  # No Docker setup: the corpus tier is a configuration-resolution differential, so it
  # brings nothing up. Establishing a precondition this tier does not have would only turn
  # a missing builder into a confusing failure.
  corpus:
    name: corpus canary
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0'
    runs-on: ubuntu-latest
    # The corpus tier's cost is 33 network round trips plus 33 oracle invocations, not a
    # 30-minute exploration. This is the backstop for a run that stops making progress,
    # never the thing that ends a healthy one.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-discovery-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-discovery-
            ${{ runner.os }}-cargo-

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Provision the pinned oracle
        # The corpus tier is a differential: it compares deacon against the reference over
        # inputs nobody here wrote. A missing or mismatched oracle FAILS the run — there is
        # no skip, because "the ecosystem agrees with us" and "we never compared anything"
        # must never look alike.
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version fixtures/parity-corpus/oracle.json)"
          echo "Installing @devcontainers/cli@${VERSION} from fixtures/parity-corpus/oracle.json"
          npm install -g "@devcontainers/cli@${VERSION}"

      - name: Verify oracle version
        run: devcontainer --version

      - name: Build deacon
        run: cargo build -p deacon

      - name: Run the weekly corpus canary
        # The seed is fixed rather than random: this tier draws nothing, so the seed
        # contributes only to the campaign's derived id, and a fixed one makes consecutive
        # weekly runs over an unchanged manifest and unchanged pins the SAME campaign —
        # which is correct, and is what lets the queue's deduplication tell "still
        # diverging" from "diverged again".
        run: |
          cargo run -p parity-harness --bin discovery-campaign -- \
            --seed 0x0000c0f5 \
            --tier corpus \
            --budget-seconds 1800 \
            --lane scheduled

      - name: Render the findings queue
        run: cargo run -p deacon-conformance -- discovery report

      - name: Validate the discovery data root
        # D1–D5 over the record the canary just wrote, including **D4** over any content
        # digest it recorded at first materialization. A machinery failure, not a finding.
        run: cargo run -p deacon-conformance -- discovery check

      - name: Upload the corpus canary artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-corpus-queue
          path: target/discovery/
          if-no-files-found: warn

      - name: Upload the written discovery data root
        # Includes `corpus.json` with any digest recorded at first materialization. Every
        # later run VERIFIES that digest, so this artifact is the diff a reviewer commits
        # from — uploaded, never pushed: review is a human act (FR-036).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-corpus-data-root
          path: conformance/discovery/
          if-no-files-found: warn
