# Container-backed pull-request lane (026-continuous-conformance-certification, US3).
#
# Runs deacon against PINNED EXPECTED OBSERVABLES for the supported certification profile
# and emits the execution manifest certification consumes.
#
# **It never resolves the reference implementation** (FR-012). That is the whole reason
# this lane can gate a pull request: it is deterministic and independent of upstream
# availability, so a red result means deacon changed — not that npm was slow or that
# upstream republished a tag. The live comparison lives in `parity.yml` and is nightly.
#
# There is deliberately NO `continue-on-error` anywhere. A lane whose precondition is
# missing must FAIL, never skip (FR-004): the value of the whole lane model is that a green
# status means the units ran.
name: conformance-docker

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'conformance/registry/**'
      - 'conformance/fixtures/**'
      - 'conformance/lanes/**'
      - '.config/nextest.toml'
      - '.github/workflows/conformance-docker.yml'
  workflow_dispatch:
  # Invoked by the release workflow to produce the manifest for certification.
  workflow_call:
    outputs:
      manifest-artifact:
        description: "Name of the uploaded execution-manifest artifact"
        value: execution-manifest

jobs:
  pinned-observables:
    name: pinned-observables
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pr-docker-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pr-docker-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The engine is a declared precondition of this lane. Probing it here turns "absent
      # engine" into a named failure rather than a confusing one inside a case.
      - name: Verify the container engine is available
        run: |
          docker version
          docker compose version

      - name: Run the container-backed lane
        run: cargo nextest run --profile pr-docker --no-fail-fast

      # Uploaded on red runs too: the manifest is diagnostic, and suppressing it when the
      # lane fails hides the evidence exactly when it is most needed.
      - name: Upload execution manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: execution-manifest
          path: target/conformance/execution-manifest.json
          if-no-files-found: error
