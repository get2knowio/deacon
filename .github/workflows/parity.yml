# The live differential parity lane.
#
# The SINGLE lane that provisions the pinned reference `@devcontainers/cli` and runs
# the live comparison. Every OTHER lane excludes the live parity binaries by nextest
# profile, so their status stays truthful by non-selection: a green fast run never
# implies parity ran.
#
# This lane GATES NOTHING. It is not in the release path.
#
# Provisioning only happens here; ALL pass/fail logic lives in the harness, and the
# nextest exit code is the verdict. There is deliberately NO `continue-on-error`
# anywhere: any failing step fails the lane, and `target/parity/` is uploaded even on
# red runs so the raw outputs and report fragments are always diagnosable.
name: parity

on:
  # Nightly on the default branch — catches oracle republish / base-image drift.
  schedule:
    - cron: '0 5 * * *'
  # On-demand (release certification).
  workflow_dispatch:
  # Guard the harness/corpus/pin themselves on PRs that touch them.
  #
  # 023 US6: after the migration the DECLARATIVE case records are the primary parity
  # surface — `parity_differential` drives them and the four config-corpus carriers
  # that used to are gone. A trigger list naming only the old locations would let a
  # `cases.json` or fixture edit change what the live lane runs without running it, which
  # is the same silent-non-selection failure this lane exists to prevent.
  pull_request:
    paths:
      - 'crates/parity-harness/**'
      - 'crates/deacon/tests/parity_*'
      - 'crates/deacon/tests/consistency_*'
      - 'parity/**'
      - 'scripts/parity/**'
      - '.config/nextest.toml'
      - 'Makefile'
      - '.github/workflows/parity.yml'

jobs:
  live-certification:
    name: live-certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-parity-
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Provision the pinned oracle
        # Install EXACTLY the version in the pin file — the harness re-verifies it,
        # so provisioning and harness can never disagree about the reference.
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version parity/oracle.json)"
          echo "Installing @devcontainers/cli@${VERSION} from parity/oracle.json"
          npm install -g "@devcontainers/cli@${VERSION}"

      # FR-014: the resolved reference must be EXACTLY the declared stable pin. Any other
      # version fails the lane as a MACHINERY error rather than being reported as a
      # behavioral divergence — a comparison against the wrong reference produces
      # differences that describe nothing, and treating them as findings would send a
      # reviewer after a divergence that does not exist.
      - name: Assert the resolved reference is exactly the stable pin
        run: |
          set -euo pipefail
          PINNED="$(jq -r .version parity/oracle.json)"
          RESOLVED="$(devcontainer --version | tr -d '[:space:]')"
          if [ "$RESOLVED" != "$PINNED" ]; then
            echo "::error::resolved reference is ${RESOLVED}, declared stable pin is ${PINNED}."
            echo "::error::This is a machinery failure, NOT a divergence (FR-014): a comparison"
            echo "::error::against the wrong reference produces differences that describe nothing."
            exit 1
          fi
          echo "reference verified: ${RESOLVED} == declared pin ${PINNED}"

      # 024 Phase 7: an EXPLICIT BuildKit precondition, landed before the runner starts
      # depending on it so the runner change is never the thing that reddens the lane.
      #
      # Declarative cases with a `build` operation need BuildKit. The GitHub runner ships
      # buildx today, so this step is mostly an assertion — which is the point: the
      # alternative was an outcome-conditional assertion inside the case data, tolerating
      # "succeeded OR failed" because BuildKit's presence was unknown. That was nearly
      # vacuous, since every one of those invocations passes `--output-format json` and
      # deacon's JSON ERROR document also contains `"outcome"`. Establishing the
      # precondition here, and checking it in `prereq::require_buildkit()`, dissolves the
      # need for that assertion shape entirely.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # PINNED BELOW 0.37, and ONLY in this job, because the ORACLE cannot run
          # on 0.37 (#745). buildx 0.37 gates reading a local path outside the build
          # context behind an `fs.read` entitlement; a Compose `build.dockerfile:` is
          # such a read, and the entitlement is granted by declaring that directory
          # as a named local build context. The reference CLI ALWAYS runs an extended
          # Compose build, so with no Features declared it names a Dockerfile in a
          # directory it never declares as a context, and dies:
          #
          #   additional privileges requested: pass
          #   "--allow=fs.read=.../container-features/0.87.0-.../Dockerfile-with-features"
          #
          # MEASURED on `fx-upstream-devport-userenvprobe`, both ways: `devcontainer up`
          # exits 1 with `{"outcome":"error"}` on buildx 0.37.2 and succeeds on 0.36.1.
          # deacon succeeds on BOTH, because it runs no extended build when there are no
          # Features — so this is the reference's defect, and deacon is the conformant
          # side (see `parity/SPEC_STATUS.md`).
          #
          # STILL BROKEN AT 0.89.0, re-measured when the pin was bumped: the same
          # `--allow=fs.read=…/container-features/0.89.0-…/Dockerfile-with-features`
          # refusal and the same error document. So the pin is not waiting on a release
          # that already shipped — upstream owes the fix deacon made in #743, and
          # `scripts/parity/check-pinned-authorities.sh` is what will tell us when a
          # newer oracle appears to re-test it against.
          #
          # The oracle cannot be patched, so without this the
          # differential lane reports a difference that describes the runner's buildx
          # rather than deacon — exactly what the reference-version assertion above
          # exists to prevent, one layer down.
          #
          # THE COST IS REAL AND IS ACCEPTED DELIBERATELY: this lane can no longer
          # observe buildx-0.37 behaviour, which is the very class of defect #743 was.
          # That is survivable only because the GATING lanes are untouched — they use
          # the runner's own buildx, currently 0.37.2, and that is where #743 was in
          # fact caught. Comparison needs an oracle that runs; reality-checking needs a
          # current buildx; the two lanes now do one job each. Revisit when the pin
          # moves to a reference release that handles 0.37.
          version: v0.36.1

      - name: Verify BuildKit is available
        # Fail LOUD and early rather than letting a `build` case report a divergence that
        # is really a missing builder. `require_buildkit()` performs the same check inside
        # the harness for local runs.
        run: |
          docker buildx version
          docker buildx inspect --bootstrap >/dev/null
          echo "BuildKit is available"

      - name: Build deacon
        run: cargo build -p deacon

      - name: Build + pre-pull declarative-fixture images
        # Delegates to the SAME script `make test-parity` runs, so a developer's local
        # run and this lane warm an identical set. That single implementation is the
        # point: this step and the script previously carried two copies of the same
        # fixture-discovery glob, and 023 T116 was one of those copies rotting to match
        # nothing while still exiting 0. The script now DISCOVERS configs (any depth,
        # `.json` or `.jsonc`) and FAILS LOUD if it finds none, so a future layout change
        # cannot silently warm nothing again.
        #
        # Why warming matters at all: `read-configuration --include-merged-configuration`
        # reads an image's `devcontainer.metadata` LABEL, pulling on a cache miss to match
        # the reference CLI (#307). On a cold runner a multi-GB base would blow the
        # harness's 120s per-invocation bound — `universal:2-linux` alone is 9.93 GB, and
        # a first pull takes minutes with no HTTP progress deacon can log, so the timeout
        # reads as a hang rather than as first-pull latency.
        run: ./scripts/parity/prepull-fixture-images.sh

      - name: Run live parity comparison
        # The nextest exit code IS the verdict. A divergence with no covering tolerance,
        # a tolerance whose difference no longer reproduces (stale), a missing oracle, an
        # absent Docker daemon and a normalization failure all fail here with a
        # cause-specific error. Nothing downstream re-decides it.
        #
        # `--no-fail-fast` is REQUIRED, not a preference. This lane's job is to enumerate
        # the diverging set as a work queue; the default cancel-on-first-failure truncates
        # it to whichever group happened to fail first. Measured on run 30737990462:
        # 26 tests selected, `differential_group_none` failed at 53s, and 19 of 26 never
        # ran — so the nightly reported two observable paths while the Docker groups went
        # unexamined. A run that stops at the first item cannot distinguish one broken
        # thing from forty, which is precisely the red-by-default state this suite exists
        # to end. Each group already bounds itself (five minutes per case, FR-077b), so
        # running them all costs wall clock, never a hang.
        run: cargo nextest run --profile parity --no-fail-fast

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-evidence
          path: target/parity/
          if-no-files-found: warn
